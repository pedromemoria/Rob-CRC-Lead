services:
  - type: web
    name: robo-crc-lead
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.x"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: AGENDAMENTO_URL
        sync: false
      - key: KOMMO_SUBDOMAIN
        sync: false
      - key: KOMMO_ACCOUNT_ID
        sync: false
      - key: KOMMO_ACCESS_TOKEN
        sync: false
      - key: KOMMO_WEBHOOK_TOKEN
        sync: false
      - key: KOMMO_PIPELINE_ID
        sync: false
      - key: KOMMO_STAGE_QUALIFICADO_ID
        sync: false
      - key: KOMMO_RESPONSAVEL_ID
        sync: false
      - key: GHL_ACCESS_TOKEN
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GHL_PIPELINE_ID
        sync: false
      - key: GHL_STAGE_QUALIFICADO_ID
        sync: false
      - key: GHL_RESPONSAVEL_ID
        sync: false
